<!doctype html>
<html lang="en" data-root=".">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Find Local Food · Chaffee Provides</title>
<meta name="description" content="Map of Chaffee County farms, ranches, farm stands, pickup points, farmers markets and free-food sites. Search by what you want to buy.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200;0,300;0,400;1,200&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="find-food.html">
<script>
// ?embed=1 shows the map alone (no header, filters or footer), for embedding on another page.
if (new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("embed");
</script>
<div id="site-header"></div>
<main id="main" class="finder" data-view="list">
  <aside aria-label="Filters and results">
    <div class="filters">
      <h1 style="font-size:1.6rem;margin:0">Find local food</h1>
      <label class="sr-only" for="q">Search</label>
      <input type="search" id="q" placeholder="Search honey, beef, eggs, a farm or a town…" autocomplete="off" list="suggest">
      <datalist id="suggest"></datalist>
      <div class="chips" id="products" role="group" aria-label="What are you looking for?"></div>
      <div class="row">
        <label for="town" class="sr-only">Town</label>
        <select id="town" style="flex:1"><option value="">All towns</option></select>
        <label><input type="checkbox" id="snap"> Accepts SNAP</label>
      </div>
      <div class="row"><label><input type="checkbox" id="dropin"> Open for drop-in visits</label></div>
      <div class="mobile-toggle" role="group" aria-label="View">
        <button class="chip" data-view="list" aria-pressed="true">List</button>
        <button class="chip" data-view="map" aria-pressed="false">Map</button>
      </div>
    </div>
    <div class="count"><span id="count" aria-live="polite"></span><button id="reset" class="chip" style="padding:2px 10px">Reset</button></div>
    <div class="list" id="list"></div>
  </aside>
  <div class="mapbox"><div id="map" role="region" aria-label="Map of places to buy local food"></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  "use strict";
  var esc = CP.esc;
  var state = { q:"", cat:"", product:"", town:"", snap:false, dropin:false };
  var els = { q:document.getElementById("q"), products:document.getElementById("products"),
    town:document.getElementById("town"), snap:document.getElementById("snap"), dropin:document.getElementById("dropin"), list:document.getElementById("list"),
    count:document.getElementById("count"), suggest:document.getElementById("suggest") };

  var map = L.map("map", { zoomControl:false, scrollWheelZoom:true }).setView([38.73, -106.1], 9);
  L.control.zoom({ position:"bottomright" }).addTo(map);
  CP.basemap(map);
  var countyBounds = null;  // the unfiltered view frames the whole county, not just the pins
  var countyReady = CP.countyOutline(map).then(function(line){ if(line) countyBounds = line.getBounds(); });
  var layer = L.layerGroup().addTo(map);
  var MODEL = null, ALL = [];

  // URL <-> state, so any filtered view can be shared or bookmarked.
  function readUrl(){
    var p = new URLSearchParams(location.search);
    state.q = p.get("q") || ""; state.cat = p.get("cat") || ""; state.product = p.get("product") || "";
    state.town = p.get("town") || ""; state.snap = p.get("snap") === "1"; state.dropin = p.get("dropin") === "1";
  }
  function writeUrl(){
    var p = new URLSearchParams(), cur = new URLSearchParams(location.search);
    ["embed","basemap"].forEach(function(k){ if(cur.get(k)) p.set(k, cur.get(k)); });
    ["q","cat","product","town"].forEach(function(k){ if(state[k]) p.set(k, state[k]); });
    if(state.snap) p.set("snap","1");
    if(state.dropin) p.set("dropin","1");
    var s = p.toString();
    history.replaceState(null, "", location.pathname + (s ? "?"+s : ""));
  }

  function chip(group, key, label, dot){
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.dataset.key = key;
    b.innerHTML = (dot ? '<span class="dot" style="background:'+dot+'"></span>' : "") + esc(label);
    b.addEventListener("click", function(){ state[group] = state[group] === key ? "" : key; sync(); apply(); });
    return b;
  }
  // Map key: pin color = kind of place. Each entry also filters. A 📍 pin is a pickup point of that color.
  function addLegend(){
    var Legend = L.Control.extend({ options:{ position:"bottomleft" }, onAdd:function(){
      var div = L.DomUtil.create("div", "map-legend");
      var cats = Object.keys(CP.GROUPS).filter(function(k){ return ALL.some(function(r){ return r.cat === k; }); });
      div.innerHTML = '<div class="map-legend-title">Map key</div>' + cats.map(function(k){
        return '<button type="button" data-key="'+k+'"><span class="pin-swatch" style="background:'+CP.typeStyle(k).hex+'"><span aria-hidden="true">'+CP.typeStyle(k).emoji+'</span></span>'+esc(CP.GROUPS[k].label)+'</button>';
      }).join("") + '<div class="map-legend-note"><span class="pin-swatch" style="background:#7a7a72"><span aria-hidden="true">📍</span></span>Pickup point</div><div class="map-legend-note"><span class="pin-swatch" style="background:#7a7a72"><span aria-hidden="true">' + CP.typeStyle("market").emoji + '</span></span>Sells at a farmers market</div>'
        + '<div class="map-legend-note"><span class="pin-swatch faded" style="background:#7a7a72"><span aria-hidden="true"></span></span>Faded: not confirmed yet</div>';
      L.DomEvent.disableClickPropagation(div);
      div.querySelectorAll("button").forEach(function(b){
        b.addEventListener("click", function(){ state.cat = state.cat === b.dataset.key ? "" : b.dataset.key; sync(); apply(); });
      });
      return div;
    }});
    new Legend().addTo(map);
  }
  function sync(){
    els.q.value = state.q; els.town.value = state.town; els.snap.checked = state.snap; els.dropin.checked = state.dropin;
    [["product",els.products]].forEach(function(g){
      g[1].querySelectorAll(".chip").forEach(function(c){ c.setAttribute("aria-pressed", c.dataset.key === state[g[0]] ? "true" : "false"); });
    });
    document.querySelectorAll(".map-legend button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.key === state.cat ? "true" : "false"); });
  }

  // Which of a record's places are shown under the current filters (the record shows if any are).
  // null = the listing doesn't match the filters; [] = it matches but has no place to show (still listed, just not pinned).
  function shownPlaces(r){
    if(state.cat && r.cat !== state.cat) return null;
    if(state.product && r.productGroups.indexOf(state.product) === -1) return null;
    if(state.snap && r.raw.accepts_snap !== true) return null;
    if(state.dropin && r.dropin !== true) return null;
    var inTown = function(p){ return !state.town || p.loc.city === state.town; };
    var placeless = !r.places.length;
    if(state.q){
      var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      for(var i=0;i<words.length;i++) if(r.search.indexOf(words[i]) === -1) return null;
      // If the words only match through a place (a shop the farm sells at), keep the listing but pin just those places.
      var onlyPlaces = words.some(function(w){ return r.baseSearch.indexOf(w) === -1; });
      if(onlyPlaces){
        var hit = r.places.filter(function(p){
          return inTown(p) && words.every(function(w){ return (r.baseSearch + " " + p.search).indexOf(w) !== -1; });
        });
        return hit.length ? hit : null;
      }
    }
    var ps = r.places.filter(inTown);
    if(!ps.length && !(placeless && (!state.town || r.towns.indexOf(state.town) !== -1))) return null;
    return ps;
  }

  function catTag(r){ var st = CP.typeStyle(r.cat); return '<span class="tag" style="color:'+st.color+'">'+esc(CP.catLabel(r.cat))+'</span>'; }
  function popup(p){
    var r = p.rec;
    var where = CP.placeLabel(p);
    var dropinHere = p.role === "home_base" && r.dropin === true;   // the visit flag and the farm's hours read as one block
    var title = p.title !== p.loc.address && p.title !== p.loc.city && p.title !== r.name ? p.title : "";
    var addr = p.loc.address ? esc(p.loc.address) + (p.loc.city && p.loc.address.toLowerCase().indexOf(p.loc.city.toLowerCase()) === -1 ? ", " + esc(p.loc.city) : "") : (p.loc.city ? esc(p.loc.city) : "");
    return '<h4>'+esc(r.name)+'</h4><div style="margin:2px 0 6px"><a href="'+CP.recUrl(r)+'">Details →</a></div><div style="margin-bottom:6px">'+catTag(r)+'</div>'
      + '<div style="font-size:.9rem"><strong>'+(dropinHere ? 'Drop-in visits welcome at the farm' : esc(where)+(title ? ": "+esc(title) : ""))+'</strong>'+(addr ? '<br>'+addr : '')+(p.hours ? '<br>'+esc(p.hours) : '')+'</div>'
      + (r.productText.length ? '<div class="muted" style="font-size:.85rem;margin-top:6px">'+esc(r.productText.join(" · "))+'</div>' : '')
      + (p.unconfirmed ? '<div class="muted" style="font-size:.84rem;margin-top:6px">Not confirmed yet that they sell here.</div>' : '')
      + (r.raw.phone || r.raw.website ? '<div style="margin-top:6px;font-size:.9rem">'
        + [r.raw.phone ? '<a href="tel:'+esc(r.raw.phone.replace(/[^0-9+]/g,""))+'">'+esc(r.raw.phone)+'</a>' : "", r.raw.website ? CP.safeLink(r.raw.website, "Website") : ""].filter(Boolean).join(' · ') + '</div>' : '')
      + '<div style="margin-top:8px"><a href="'+CP.directions(p)+'" target="_blank" rel="noopener">Directions</a></div>';
  }

  // Several businesses can sell at one spot (a farmers market, a pickup lot). One pin per place, listing who is there.
  function groupPopup(g){
    var lead = g.ps.filter(function(p){ return p.role === "market_site" || p.role === "access_site"; })[0] || g.ps[0];
    var L0 = lead.loc, isMarket = lead.role === "market_site";
    var title = isMarket ? lead.rec.name : (L0.name || L0.address || L0.city || "This spot");
    var others = g.ps.filter(function(p){ return p !== lead || !isMarket; });
    var addr = L0.address ? esc(L0.address) + (L0.city && L0.address.toLowerCase().indexOf(L0.city.toLowerCase()) === -1 ? ", " + esc(L0.city) : "") : esc(L0.city || "");
    var items = others.map(function(p){
      return '<li><a href="'+CP.recUrl(p.rec)+'">'+esc(p.rec.name)+'</a>'+(p.rec.productText.length ? ' <span class="muted">· '+esc(p.rec.productText.slice(0,3).join(", "))+'</span>' : '')+'</li>';
    }).join("");
    return '<h4>'+esc(title)+'</h4>'+(isMarket ? '<div style="margin:2px 0 6px"><a href="'+CP.recUrl(lead.rec)+'">Market details →</a></div>' : '')+'<div style="font-size:.9rem">'+addr+(lead.hours ? '<br>'+esc(lead.hours) : '')+'</div>'
      + '<div class="muted" style="margin-top:8px;font-size:.85rem">'+(isMarket ? "Vendors here (" + others.length + "):" : "Businesses here:")+'</div>'
      + '<ul class="plain" style="max-height:170px;overflow:auto;font-size:.9rem">'+items+'</ul>'
      + '<div style="margin-top:8px"><a href="'+CP.directions(lead)+'" target="_blank" rel="noopener">Directions</a></div>';
  }

  function apply(){
    writeUrl();
    var stamp = apply.n = (apply.n || 0) + 1;
    var rows = ALL.map(function(r){ return { r:r, ps:shownPlaces(r) }; }).filter(function(x){ return x.ps; });
    CP.browse.save(rows.map(function(x){ return x.r.slug; }));
    layer.clearLayers();
    els.list.innerHTML = rows.map(function(x){
      var r = x.r, pins = x.ps.filter(function(p){ return p.pin; }).length;
      var sub = [r.towns.slice(0,3).join(", "), r.productText.slice(0,4).join(" · ") || (r.group === "access" ? (r.hours || "") : "")].filter(Boolean).join(" · ");
      return '<a class="result" href="'+CP.recUrl(r)+'" data-id="'+esc(r.id)+'"><strong>'+esc(r.name)+'</strong>'
        + '<div class="types">'+catTag(r)+CP.visitBadge(r)+'</div><div class="sub">'+esc(sub)+(pins > 1 ? ' · '+pins+' places' : '')+'</div></a>';
    }).join("") || '<p style="padding:16px" class="muted">Nothing matches those filters. <button class="chip" id="reset2">Clear filters</button></p>';
    var r2 = document.getElementById("reset2"); if(r2) r2.addEventListener("click", reset);

    var pins = [];
    rows.forEach(function(x){ x.ps.forEach(function(p){ if(p.pin) pins.push(p); }); });
    var byLoc = {};
    pins.forEach(function(p){ (byLoc[p.loc.id] = byLoc[p.loc.id] || []).push(p); });
    var groups = Object.keys(byLoc).map(function(k){ return { id:k, ps:byLoc[k], lat:byLoc[k][0].lat, lng:byLoc[k][0].lng }; });
    var offs = CP.fanOut(groups);
    var bounds = [];
    groups.forEach(function(g){
      var lead = g.ps.filter(function(p){ return p.role === "market_site" || p.role === "access_site"; })[0] || g.ps[0];
      var many = g.ps.length > 1;
      var unconf = g.ps.every(function(p){ return p.unconfirmed; });
      var m = L.marker([g.lat, g.lng], { icon:CP.pinIcon(lead.kind, offs[g.id], unconf, !many && lead.pickup, !many && lead.market), title:many ? (lead.role === "market_site" ? lead.rec.name : "Several businesses") : lead.rec.name })
        .bindPopup(many ? groupPopup(g) : popup(lead), { maxWidth:300 });
      g.ps.forEach(function(p){
        m.on("mouseover", function(){ hl(p.rec.id, true); }); m.on("mouseout", function(){ hl(p.rec.id, false); });
        if(p.rec._stamp !== stamp){ p.rec._m = m; p.rec._stamp = stamp; }
      });
      m.addTo(layer); bounds.push([g.lat, g.lng]);
    });
    var offMap = rows.filter(function(x){ return !x.ps.some(function(p){ return p.pin; }); }).length;
    els.count.textContent = rows.length + " of " + ALL.length + " listings · " + groups.length + " places on the map" + (offMap ? " ("+offMap+" not on the map)" : "");
    var filtered = state.q || state.cat || state.product || state.town || state.snap || state.dropin;
    var fit = bounds.length ? L.latLngBounds(bounds) : null;
    if(!filtered && countyBounds) fit = fit ? fit.extend(countyBounds) : countyBounds;
    if(fit) map.fitBounds(fit, { padding:[24,24], maxZoom:12 });
  }
  function hl(id, on){
    var el = els.list.querySelector('[data-id="'+CSS.escape(id)+'"]');
    if(el) el.classList.toggle("hl", on);
  }
  els.list.addEventListener("mouseover", function(e){
    var a = e.target.closest(".result"); if(!a) return;
    var r = ALL.find(function(x){ return x.id === a.dataset.id; });
    if(r && r._m) r._m.openPopup();
  });
  function reset(){ state = { q:"", cat:"", product:"", town:"", snap:false, dropin:false }; sync(); apply(); }

  var t;
  els.q.addEventListener("input", function(){ clearTimeout(t); t = setTimeout(function(){ state.q = els.q.value.trim(); apply(); }, 150); });
  els.town.addEventListener("change", function(){ state.town = els.town.value; apply(); });
  els.snap.addEventListener("change", function(){ state.snap = els.snap.checked; apply(); });
  els.dropin.addEventListener("change", function(){ state.dropin = els.dropin.checked; apply(); });
  document.getElementById("reset").addEventListener("click", reset);
  document.querySelectorAll(".mobile-toggle .chip").forEach(function(b){
    b.addEventListener("click", function(){
      document.getElementById("main").dataset.view = b.dataset.view;
      document.querySelectorAll(".mobile-toggle .chip").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      if(b.dataset.view === "map") setTimeout(function(){ map.invalidateSize(); apply(); }, 50);
    });
  });

  Promise.all([CP.loadModel(), countyReady]).then(function(r){
    MODEL = r[0]; ALL = MODEL.recs;
    var usedP = {}; ALL.forEach(function(x){ x.productGroups.forEach(function(g){ usedP[g] = (usedP[g]||0) + 1; }); });
    Object.keys(MODEL.vocab.product_groups).filter(function(k){ return usedP[k]; }).forEach(function(k){
      els.products.appendChild(chip("product", k, MODEL.vocab.product_groups[k]));
    });
    // Kinds of place are not quick filters here: the map key (bottom left) already lists them and filters by them.
    var towns = {}; ALL.forEach(function(x){ x.places.forEach(function(p){ if(p.pin && p.loc.city) towns[p.loc.city] = (towns[p.loc.city]||0) + 1; }); });
    Object.keys(towns).sort().forEach(function(t){
      var o = document.createElement("option"); o.value = t; o.textContent = t + " ("+towns[t]+")"; els.town.appendChild(o);
    });
    // Search suggestions: product names, businesses and towns, so typing "ho" offers Honey and the farms that sell it.
    var names = {}; ALL.forEach(function(x){ names[x.name] = 1; x.towns.forEach(function(t){ names[t] = 1; }); });
    Object.keys(MODEL.vocab.product_groups).forEach(function(k){ if(usedP[k]) names[MODEL.vocab.product_groups[k]] = 1; });
    els.suggest.innerHTML = Object.keys(names).sort().map(function(n){ return '<option value="'+esc(n)+'">'; }).join("");
    addLegend();
    readUrl(); sync(); apply();
  }).catch(function(e){
    els.list.innerHTML = '<p style="padding:16px">Could not load the listings ('+esc(e.message)+').</p>';
  });
})();
</script>
<div id="site-footer" hidden></div>
</body>
</html>
