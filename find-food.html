<!doctype html>
<html lang="en" data-root=".">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Find Local Food · Chaffee Provides</title>
<meta name="description" content="Map of Chaffee County farms, ranches, farm stands, pickup points, farmers markets and free-food sites.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200;0,300;0,400;1,200&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="find-food.html">
<script>
// ?embed=1 shows the map alone (no header, filters or footer), for embedding on another page.
if (new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("embed");
</script>
<div id="site-header"></div>
<main id="main" class="finder" data-view="list">
  <aside aria-label="Filters and results">
    <div class="filters">
      <h1 style="font-size:1.6rem;margin:0">Find local food</h1>
      <label class="sr-only" for="q">Search</label>
      <input type="search" id="q" placeholder="Search a farm, product or town…" autocomplete="off" list="suggest">
      <datalist id="suggest"></datalist>
      <div class="chips" id="channels" role="group" aria-label="How you can get it"></div>
      <div class="row">
        <label for="town" class="sr-only">Town</label>
        <select id="town" style="flex:1"><option value="">All towns</option></select>
      </div>
      <div class="row"><label><input type="checkbox" id="snap"> Accepts SNAP</label></div>
      <div class="mobile-toggle" role="group" aria-label="View">
        <button class="chip" data-view="list" aria-pressed="true">List</button>
        <button class="chip" data-view="map" aria-pressed="false">Map</button>
      </div>
    </div>
    <div class="count"><span id="count" aria-live="polite"></span><button id="reset" class="chip" style="padding:2px 10px">Reset</button></div>
    <div class="list" id="list"></div>
  </aside>
  <div class="mapbox"><div id="map" role="region" aria-label="Map of places to buy local food"></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  "use strict";
  var esc = CP.esc;
  var state = { q:"", type:"", channel:"", town:"", snap:false };
  var els = { q:document.getElementById("q"), channels:document.getElementById("channels"), town:document.getElementById("town"),
    snap:document.getElementById("snap"), list:document.getElementById("list"), count:document.getElementById("count"),
    suggest:document.getElementById("suggest") };
  var EMBED = document.documentElement.classList.contains("embed");

  var map = L.map("map", { zoomControl:false, scrollWheelZoom:true }).setView([38.73, -106.1], 9);
  L.control.zoom({ position:"bottomright" }).addTo(map);
  CP.basemap(map);
  var countyBounds = null;  // the unfiltered view frames the whole county, not just the pins
  var countyReady = CP.countyOutline(map).then(function(line){ if(line) countyBounds = line.getBounds(); });
  var layer = L.layerGroup().addTo(map);
  var MODEL = null, ALL = [];

  // URL <-> state, so any filtered view can be shared or bookmarked.
  function readUrl(){
    var p = new URLSearchParams(location.search);
    state.q = p.get("q") || ""; state.type = p.get("type") || ""; state.channel = p.get("channel") || "";
    state.town = p.get("town") || ""; state.snap = p.get("snap") === "1";
  }
  function writeUrl(){
    var p = new URLSearchParams(), cur = new URLSearchParams(location.search);
    ["embed","basemap"].forEach(function(k){ if(cur.get(k)) p.set(k, cur.get(k)); });
    ["q","type","channel","town"].forEach(function(k){ if(state[k]) p.set(k, state[k]); });
    if(state.snap) p.set("snap","1");
    var s = p.toString();
    history.replaceState(null, "", location.pathname + (s ? "?"+s : ""));
  }

  function chip(key, label){
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.dataset.key = key; b.textContent = label;
    b.addEventListener("click", function(){ state.channel = state.channel === key ? "" : key; sync(); apply(); });
    return b;
  }
  // Map key: what each pin color means. Each entry also filters.
  function addLegend(){
    var Legend = L.Control.extend({ options:{ position:"bottomleft" }, onAdd:function(){
      var div = L.DomUtil.create("div", "map-legend");
      var kinds = Object.keys(CP.GROUPS).filter(function(k){ return ALL.some(function(r){ return r.places.some(function(p){ return p.pin && p.kind === k; }); }); });
      div.innerHTML = '<div class="map-legend-title">Map key</div>' + kinds.map(function(k){
        return '<button type="button" data-key="'+k+'"><span class="pin-swatch" style="background:'+CP.typeStyle(k).hex+'"><span aria-hidden="true">'+CP.typeStyle(k).emoji+'</span></span>'+esc(CP.GROUPS[k].label)+'</button>';
      }).join("") + '<div class="map-legend-note"><span class="pin-swatch faded" style="background:#7a7a72"><span aria-hidden="true"></span></span>Faded pin: call first, not confirmed yet</div>';
      L.DomEvent.disableClickPropagation(div);
      div.querySelectorAll("button").forEach(function(b){
        b.addEventListener("click", function(){ state.type = state.type === b.dataset.key ? "" : b.dataset.key; sync(); apply(); });
      });
      return div;
    }});
    new Legend().addTo(map);
  }
  function sync(){
    els.q.value = state.q; els.town.value = state.town; els.snap.checked = state.snap;
    els.channels.querySelectorAll(".chip").forEach(function(c){ c.setAttribute("aria-pressed", c.dataset.key === state.channel ? "true" : "false"); });
    document.querySelectorAll(".map-legend button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.key === state.type ? "true" : "false"); });
  }

  // Which of a record's places are shown under the current filters (the record shows if any are).
  function shownPlaces(r){
    if(state.channel && r.channels.indexOf(state.channel) === -1) return [];
    if(state.snap && r.raw.accepts_snap !== true) return [];
    if(state.q){
      var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      for(var i=0;i<words.length;i++) if(r.search.indexOf(words[i]) === -1) return [];
    }
    return r.places.filter(function(p){
      if(state.type && p.kind !== state.type) return false;
      if(state.town && p.loc.city !== state.town) return false;
      return true;
    });
  }

  function typeLine(r){
    var kinds = [r.group];
    r.places.forEach(function(p){ if(p.kind === "pickup" && kinds.indexOf("pickup") === -1) kinds.push("pickup"); });
    return kinds.map(function(k){ var st = CP.typeStyle(k); return '<span class="tag" style="color:'+st.color+'">'+esc(CP.GROUPS[k].label)+'</span>'; }).join("");
  }
  function popup(p){
    var r = p.rec;
    var where = [CP.ROLE_LABEL[p.role] || "", p.title].filter(Boolean);
    if(where.length === 2 && where[1].indexOf(where[0]) !== -1) where.shift();
    var addr = p.loc.address && p.title !== p.loc.address ? esc(p.loc.address) + (p.loc.city ? ", " + esc(p.loc.city) : "") : (p.loc.city && p.title !== p.loc.city ? esc(p.loc.city) : "");
    return '<h4>'+esc(r.name)+'</h4><div style="margin-bottom:6px">'+typeLine(r)+'</div>'
      + '<div style="font-size:.9rem"><strong>'+esc(where.join(": "))+'</strong>'+(addr ? '<br>'+addr : '')+(p.hours ? '<br>'+esc(p.hours) : '')+'</div>'
      + (p.unconfirmed ? '<div class="muted" style="font-size:.84rem;margin-top:6px">Not confirmed yet that they sell here. Please call first.</div>' : '')
      + (r.raw.phone ? '<div style="margin-top:6px;font-size:.9rem"><a href="tel:'+esc(r.raw.phone.replace(/[^0-9+]/g,""))+'">'+esc(r.raw.phone)+'</a></div>' : '')
      + '<div style="margin-top:8px;display:flex;gap:12px"><a href="'+CP.recUrl(r)+'">Details →</a><a href="'+CP.directions(p)+'" target="_blank" rel="noopener">Directions</a></div>';
  }

  function apply(){
    writeUrl();
    var stamp = apply.n = (apply.n || 0) + 1;
    var rows = ALL.map(function(r){ return { r:r, ps:shownPlaces(r) }; }).filter(function(x){ return x.ps.length; });
    layer.clearLayers();
    els.list.innerHTML = rows.map(function(x){
      var r = x.r, pins = x.ps.filter(function(p){ return p.pin; }).length;
      var sub = [r.towns.slice(0,3).join(", "), r.channelText.slice(0,3).join(" · ") || (r.group === "access" ? (r.hours || "") : "")].filter(Boolean).join(" · ");
      return '<a class="result" href="'+CP.recUrl(r)+'" data-id="'+esc(r.id)+'"><strong>'+esc(r.name)+'</strong>'
        + '<div class="types">'+typeLine(r)+'</div><div class="sub">'+esc(sub)+(pins > 1 ? ' · '+pins+' places' : '')+'</div></a>';
    }).join("") || '<p style="padding:16px" class="muted">Nothing matches those filters. <button class="chip" id="reset2">Clear filters</button></p>';
    var r2 = document.getElementById("reset2"); if(r2) r2.addEventListener("click", reset);

    var pins = [];
    rows.forEach(function(x){ x.ps.forEach(function(p){ if(p.pin) pins.push(p); }); });
    var offs = CP.fanOut(pins);
    var bounds = [];
    pins.forEach(function(p){
      var m = L.marker([p.lat, p.lng], { icon:CP.pinIcon(p.kind, offs[p.id], p.unconfirmed), title:p.rec.name }).bindPopup(popup(p), { maxWidth:280 });
      m.on("mouseover", function(){ hl(p.rec.id, true); }); m.on("mouseout", function(){ hl(p.rec.id, false); });
      m.addTo(layer); if(p.rec._stamp !== stamp){ p.rec._m = m; p.rec._stamp = stamp; } bounds.push([p.lat, p.lng]);
    });
    var offMap = rows.filter(function(x){ return !x.ps.some(function(p){ return p.pin; }); }).length;
    els.count.textContent = rows.length + " of " + ALL.length + " listings · " + pins.length + " places on the map" + (offMap ? " ("+offMap+" not on the map)" : "");
    var filtered = state.q || state.type || state.channel || state.town || state.snap;
    var fit = bounds.length ? L.latLngBounds(bounds) : null;
    if(!filtered && countyBounds) fit = fit ? fit.extend(countyBounds) : countyBounds;
    if(fit) map.fitBounds(fit, { padding:[24,24], maxZoom:12 });
  }
  function hl(id, on){
    var el = els.list.querySelector('[data-id="'+CSS.escape(id)+'"]');
    if(el) el.classList.toggle("hl", on);
  }
  els.list.addEventListener("mouseover", function(e){
    var a = e.target.closest(".result"); if(!a) return;
    var r = ALL.find(function(x){ return x.id === a.dataset.id; });
    if(r && r._m) r._m.openPopup();
  });
  function reset(){ state = { q:"", type:"", channel:"", town:"", snap:false }; sync(); apply(); }

  var t;
  els.q.addEventListener("input", function(){ clearTimeout(t); t = setTimeout(function(){ state.q = els.q.value.trim(); apply(); }, 150); });
  els.town.addEventListener("change", function(){ state.town = els.town.value; apply(); });
  els.snap.addEventListener("change", function(){ state.snap = els.snap.checked; apply(); });
  document.getElementById("reset").addEventListener("click", reset);
  document.querySelectorAll(".mobile-toggle .chip").forEach(function(b){
    b.addEventListener("click", function(){
      document.getElementById("main").dataset.view = b.dataset.view;
      document.querySelectorAll(".mobile-toggle .chip").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      if(b.dataset.view === "map") setTimeout(function(){ map.invalidateSize(); apply(); }, 50);
    });
  });

  Promise.all([CP.loadModel(), countyReady]).then(function(r){
    MODEL = r[0]; ALL = MODEL.recs;
    var used = {}; ALL.forEach(function(x){ x.channels.forEach(function(c){ used[c] = true; }); });
    Object.keys(MODEL.vocab.sales_channels).filter(function(k){ return used[k]; }).forEach(function(k){
      els.channels.appendChild(chip(k, MODEL.vocab.sales_channels[k]));
    });
    var towns = {}; ALL.forEach(function(x){ x.places.forEach(function(p){ if(p.pin && p.loc.city) towns[p.loc.city] = (towns[p.loc.city]||0) + 1; }); });
    Object.keys(towns).sort().forEach(function(t){
      var o = document.createElement("option"); o.value = t; o.textContent = t + " ("+towns[t]+")"; els.town.appendChild(o);
    });
    // Search suggestions: business names and towns, so typing "Sal" offers Salida and the farms there.
    var names = {}; ALL.forEach(function(x){ names[x.name] = 1; x.towns.forEach(function(t){ names[t] = 1; }); });
    els.suggest.innerHTML = Object.keys(names).sort().map(function(n){ return '<option value="'+esc(n)+'">'; }).join("");
    addLegend();
    readUrl(); sync(); apply();
  }).catch(function(e){
    els.list.innerHTML = '<p style="padding:16px">Could not load the listings ('+esc(e.message)+').</p>';
  });
})();
</script>
<div id="site-footer" hidden></div>
</body>
</html>
