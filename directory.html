<!doctype html>
<html lang="en" data-root=".">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Directory · Chaffee Provides</title>
<meta name="description" content="Every farm, ranch, farm stand, farmers market and free-food site in Chaffee County, in one scrolling list you can search and filter.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200;0,300;0,400;1,200&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="directory.html">
<div id="site-header"></div>
<main id="main" class="wrap">
  <div class="dir-head">
    <h1 style="margin:0">Directory</h1>
    <p class="muted" style="max-width:62ch;margin:6px 0 0">Farms, ranches, farm stands, markets and free-food sites in Chaffee County. Prefer a map? <a href="find-food.html">Open the map →</a></p>
  </div>
  <div class="dir-tools">
    <label class="sr-only" for="q">Search</label>
    <input type="search" id="q" placeholder="Search by name, product or town…" autocomplete="off" list="suggest">
    <datalist id="suggest"></datalist>
    <div class="chips" id="types" role="group" aria-label="Kind of place"></div>
    <div class="chips" id="channels" role="group" aria-label="How you can get it"></div>
    <div class="row">
      <label class="sr-only" for="town">Town</label>
      <select id="town" style="max-width:260px"><option value="">All towns</option></select>
      <label><input type="checkbox" id="snap"> Accepts SNAP</label>
      <span class="muted" id="count" aria-live="polite"></span>
      <button id="reset" class="chip" type="button">Reset</button>
    </div>
  </div>
  <div class="grid cols-3" id="cards"></div>
  <p class="muted" style="margin:28px 0 56px">Something missing or out of date? <a id="addlink" href="list-your-business.html">Add a business</a> or tell us what to change on any listing.</p>
</main>
<div id="site-footer"></div>
<script src="assets/app.js"></script>
<script>
(function(){
  "use strict";
  var esc = CP.esc;
  var state = { q:"", type:"", channel:"", town:"", snap:false };
  var els = { q:document.getElementById("q"), types:document.getElementById("types"), channels:document.getElementById("channels"),
    town:document.getElementById("town"), snap:document.getElementById("snap"), count:document.getElementById("count"),
    cards:document.getElementById("cards"), suggest:document.getElementById("suggest") };
  var ALL = [];

  function readUrl(){
    var p = new URLSearchParams(location.search);
    ["q","type","channel","town"].forEach(function(k){ state[k] = p.get(k) || ""; });
    state.snap = p.get("snap") === "1";
  }
  function writeUrl(){
    var p = new URLSearchParams();
    ["q","type","channel","town"].forEach(function(k){ if(state[k]) p.set(k, state[k]); });
    if(state.snap) p.set("snap","1");
    var s = p.toString();
    history.replaceState(null, "", location.pathname + (s ? "?"+s : ""));
  }
  function chip(group, key, label){
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.dataset.key = key; b.textContent = label;
    b.addEventListener("click", function(){ state[group] = state[group] === key ? "" : key; sync(); apply(); });
    return b;
  }
  function sync(){
    els.q.value = state.q; els.town.value = state.town; els.snap.checked = state.snap;
    [["type",els.types],["channel",els.channels]].forEach(function(g){
      g[1].querySelectorAll(".chip").forEach(function(c){ c.setAttribute("aria-pressed", c.dataset.key === state[g[0]] ? "true" : "false"); });
    });
  }
  function passes(r){
    if(state.type && r.group !== state.type && !(state.type === "pickup" && r.places.some(function(p){ return p.kind === "pickup"; }))) return false;
    if(state.channel && r.channels.indexOf(state.channel) === -1) return false;
    if(state.town && r.towns.indexOf(state.town) === -1) return false;
    if(state.snap && r.raw.accepts_snap !== true) return false;
    if(state.q){
      var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      for(var i=0;i<words.length;i++) if(r.search.indexOf(words[i]) === -1) return false;
    }
    return true;
  }
  function card(r){
    var st = CP.typeStyle(r.group);
    var pins = r.places.filter(function(p){ return p.pin; });
    var line = r.group === "access" ? (r.hours || "") : (r.hours ? r.hours.split(";")[0] : "");
    var places = pins.length > 1 ? pins.length + " places to buy" : "";
    return '<a class="biz" href="'+CP.recUrl(r)+'">'+CP.photoHtml(r, "photo", true)
      + '<div class="body"><span class="tag" style="color:'+st.color+'">'+esc(CP.GROUPS[r.group].label)+'</span>'
      + '<h3>'+esc(r.name)+'</h3>'
      + '<div class="meta">'+esc(r.towns.slice(0,3).join(", "))+(places ? ' · '+esc(places) : '')+'</div>'
      + (r.channelText.length ? '<div class="chipline">'+r.channelText.map(function(c){ return '<span class="mini-chip">'+esc(c)+'</span>'; }).join("")+'</div>' : '')
      + (line ? '<div class="meta">'+esc(line.length > 70 ? line.slice(0,67)+"…" : line)+'</div>' : '')
      + '</div></a>';
  }
  function apply(){
    writeUrl();
    var shown = ALL.filter(passes);
    els.cards.innerHTML = shown.map(card).join("") || '<p class="muted">Nothing matches those filters.</p>';
    els.count.textContent = shown.length + " of " + ALL.length + " listings";
  }
  function reset(){ state = { q:"", type:"", channel:"", town:"", snap:false }; sync(); apply(); }
  var t;
  els.q.addEventListener("input", function(){ clearTimeout(t); t = setTimeout(function(){ state.q = els.q.value.trim(); apply(); }, 150); });
  els.town.addEventListener("change", function(){ state.town = els.town.value; apply(); });
  els.snap.addEventListener("change", function(){ state.snap = els.snap.checked; apply(); });
  document.getElementById("reset").addEventListener("click", reset);

  CP.loadModel().then(function(M){
    ALL = M.recs.slice().sort(function(a, b){ return a.name.localeCompare(b.name); });
    Object.keys(CP.GROUPS).filter(function(k){ return ALL.some(function(r){ return r.group === k || (k === "pickup" && r.places.some(function(p){ return p.kind === "pickup"; })); }); })
      .forEach(function(k){ els.types.appendChild(chip("type", k, CP.GROUPS[k].label)); });
    var used = {}; ALL.forEach(function(r){ r.channels.forEach(function(c){ used[c] = true; }); });
    Object.keys(M.vocab.sales_channels).filter(function(k){ return used[k]; }).forEach(function(k){ els.channels.appendChild(chip("channel", k, M.vocab.sales_channels[k])); });
    var towns = {}; ALL.forEach(function(r){ r.towns.forEach(function(t){ towns[t] = (towns[t]||0) + 1; }); });
    Object.keys(towns).sort().forEach(function(t){ var o = document.createElement("option"); o.value = t; o.textContent = t+" ("+towns[t]+")"; els.town.appendChild(o); });
    var names = {}; ALL.forEach(function(r){ names[r.name] = 1; r.towns.forEach(function(t){ names[t] = 1; }); });
    els.suggest.innerHTML = Object.keys(names).sort().map(function(n){ return '<option value="'+esc(n)+'">'; }).join("");
    readUrl(); sync(); apply();
  }).catch(function(e){ els.cards.innerHTML = '<p>Could not load the listings ('+esc(e.message)+').</p>'; });
})();
</script>
</body>
</html>
